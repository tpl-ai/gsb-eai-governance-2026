<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow AI — The Role Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Newsreader:ital,wght@1,400;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --red-dark:#6E1616;
    --red-deep:#4A0E0E;
    --red-accent:#8C1515;
    --red-bright:#A61B1B;
    --tier1:#E4E1DB;
    --tier2:#D9AF9C;
    --tier3:#BE5A45;
    --tier4:#6E1616;
    --cream:#F7F5F0;
    --cream-2:#F0ECE3;
    --card-bg:#EDE8DE;
    --ink:#1C1A18;
    --ink-soft:#55504A;
    --paper:#F3EFE6;
    --paper-soft:#D9CFC3;
    --gray-mid:#8B857C;
    --gray-line:#DAD5CB;
    --line-dark:rgba(245,240,230,0.18);
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --serif:'Newsreader',Georgia,serif;
    --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#0c0a09;}
  body{font-family:var(--sans);overflow:hidden;}
  .stage{position:fixed;inset:0;}
  .slide{
    position:absolute;inset:0;display:none;flex-direction:column;
    padding:clamp(28px,4.5vw,64px) clamp(32px,5.5vw,80px);
    transition:opacity .35s ease;
  }
  .slide.active{display:flex;}
  .slide.dark{background:var(--red-dark);color:var(--paper);}
  .slide.light{background:var(--cream);color:var(--ink);}
  .em{font-family:var(--serif);font-style:italic;font-weight:500;}
  .eyebrow{
    font-family:var(--mono);font-size:clamp(10px,0.85vw,12px);letter-spacing:.14em;
    text-transform:uppercase;color:var(--gray-mid);
  }
  .slide.dark .eyebrow{color:var(--paper-soft);}
  .footer{
    position:absolute;left:0;right:0;bottom:22px;padding:0 clamp(32px,5.5vw,80px);
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--gray-mid);
  }
  .slide.dark .footer{color:var(--paper-soft);}
  .dots{
    position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:center;
    gap:5px;pointer-events:none;
  }
  .dot{width:5px;height:5px;border-radius:1px;background:var(--gray-line);}
  .slide.dark .dot{background:var(--line-dark);}
  .dot.active{background:var(--red-bright);}
  .slide.dark .dot.active{background:var(--red-bright);}
  .body-copy{font-size:clamp(15px,1.35vw,19px);line-height:1.55;color:var(--ink-soft);max-width:52ch;}
  .slide.dark .body-copy{color:var(--paper-soft);}
  .content{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-bottom:60px;}

  /* ---- Cover ---- */
  .cover-top{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--paper-soft);text-transform:uppercase;}
  .cover-headline{font-family:var(--sans);font-weight:300;font-size:clamp(42px,6.4vw,92px);line-height:1.02;margin-top:18vh;letter-spacing:-.01em;}
  .cover-sub{font-size:clamp(16px,1.7vw,24px);font-weight:300;color:var(--paper-soft);margin-top:22px;max-width:46ch;line-height:1.4;}
  .cover-people{position:absolute;left:clamp(32px,5.5vw,80px);bottom:78px;display:flex;flex-direction:column;gap:6px;}
  .cover-person{font-size:15px;}
  .cover-person b{font-weight:600;}
  .cover-person span{font-family:var(--mono);font-size:11px;color:var(--paper-soft);letter-spacing:.04em;margin-left:10px;}

  /* ---- Statement / scenario ---- */
  .statement-head{font-weight:400;font-size:clamp(30px,3.6vw,50px);line-height:1.12;max-width:20ch;}
  .roles-table{margin-top:10px;border-top:1px solid var(--gray-line);}
  .role-row{display:grid;grid-template-columns:1.1fr 1.2fr 2fr;gap:24px;padding:18px 0;border-bottom:1px solid var(--gray-line);align-items:baseline;}
  .role-name{font-size:clamp(18px,1.7vw,22px);font-weight:600;}
  .role-title{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--red-accent);text-transform:uppercase;}
  .role-desc{font-size:15px;color:var(--ink-soft);}

  /* ---- list4 ---- */
  .list4{margin-top:6px;border-top:1px solid var(--gray-line);}
  .list4-row{display:grid;grid-template-columns:70px 1fr;gap:22px;padding:18px 0;border-bottom:1px solid var(--gray-line);align-items:baseline;}
  .list4-num{font-family:var(--serif);font-style:italic;font-size:clamp(24px,2.6vw,32px);color:var(--red-accent);}
  .list4-title{font-size:clamp(20px,2.1vw,27px);font-weight:500;}
  .list4-sub{font-size:14.5px;color:var(--ink-soft);margin-top:4px;}
  .list4-close{margin-top:16px;font-size:15px;color:var(--ink-soft);max-width:64ch;line-height:1.5;}
  .list4-close .em{color:var(--red-accent);}

  /* ---- stakes (light, dense) ---- */
  .stakes-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px 36px;margin-top:8px;}
  .stakes-item{border-top:1px solid var(--gray-line);padding-top:10px;}
  .stakes-kicker{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--red-accent);margin-bottom:5px;}
  .stakes-detail{font-size:13.5px;color:var(--ink-soft);line-height:1.45;}
  .stakes-callout{margin-top:16px;border-top:2px solid var(--red-accent);padding-top:14px;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink);line-height:1.5;max-width:90ch;}
  .stakes-callout .em{color:var(--red-accent);}

  /* ---- tier ladder (dark) ---- */
  .ladder{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
  .tier-row{display:grid;grid-template-columns:220px 1fr;align-items:center;border-radius:2px;overflow:hidden;}
  .tier-tag{font-family:var(--mono);font-size:12px;letter-spacing:.08em;padding:16px 18px;text-transform:uppercase;font-weight:500;}
  .tier-ctrl{padding:16px 20px;font-size:14.5px;}
  .tier-row.t1 .tier-tag{background:var(--tier1);color:#3a3630;}
  .tier-row.t1 .tier-ctrl{background:rgba(228,225,219,.14);color:var(--paper-soft);}
  .tier-row.t2 .tier-tag{background:var(--tier2);color:#3a1c10;}
  .tier-row.t2 .tier-ctrl{background:rgba(217,175,156,.16);color:var(--paper-soft);}
  .tier-row.t3 .tier-tag{background:var(--tier3);color:#fff;}
  .tier-row.t3 .tier-ctrl{background:rgba(190,90,69,.2);color:var(--paper-soft);}
  .tier-row.t4 .tier-tag{background:var(--paper);color:var(--red-dark);font-weight:700;}
  .tier-row.t4 .tier-ctrl{background:rgba(255,255,255,.08);color:var(--paper);font-weight:500;}
  .ladder-note{margin-top:14px;font-size:14.5px;color:var(--paper-soft);font-style:italic;font-family:var(--serif);}

  /* ---- grid table (light) ---- */
  .gridtable{display:grid;grid-template-columns:150px repeat(4,1fr);border-top:1px solid var(--gray-line);margin-top:6px;}
  .gcell{padding:14px 14px;font-size:13px;line-height:1.4;border-bottom:1px solid var(--gray-line);}
  .gcell.head{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--gray-mid);}
  .gcell.head i{font-style:normal;display:block;font-weight:600;color:var(--ink);font-size:11.5px;text-transform:none;margin-top:2px;}
  .gcell.dim{font-weight:600;font-size:13.5px;}
  .gcell.t1{background:var(--tier1);}
  .gcell.t2{background:#F1DCCF;}
  .gcell.t3{background:#F0C4B6;}
  .gcell.t4{background:#E7B3AA;}
  .grid-notes{margin-top:16px;display:flex;flex-direction:column;gap:6px;}
  .grid-notes p{font-size:14px;color:var(--ink-soft);}
  .grid-notes .rule{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--red-accent);}

  /* ---- flow (dark) ---- */
  .flow{display:flex;align-items:stretch;gap:0;margin-top:10px;}
  .flow-step{flex:1;background:rgba(255,255,255,.08);padding:26px 20px;text-align:center;font-size:16px;font-weight:500;display:flex;align-items:center;justify-content:center;min-height:110px;}
  .flow-step.hi{background:var(--paper);color:var(--red-dark);font-weight:700;}
  .flow-arrow{width:34px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--paper-soft);}
  .flow-note{margin-top:20px;font-size:15px;color:var(--paper-soft);max-width:60ch;line-height:1.5;}

  /* ---- case (a, dark) ---- */
  .case-tag{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--paper-soft);text-transform:uppercase;}
  .case-headline{font-size:clamp(38px,4.5vw,64px);line-height:1.16;font-weight:400;max-width:42ch;margin-top:10px;}
  .case-why{margin-top:18px;font-size:20px;color:var(--paper-soft);}
  .case-why b{color:var(--paper);font-weight:600;}
  .case-scale{margin-top:6px;font-family:var(--mono);font-size:12.5px;color:var(--paper-soft);}
  .case-quote{margin-top:26px;padding-top:18px;border-top:1px solid var(--line-dark);font-family:var(--serif);font-style:italic;font-size:24px;color:var(--paper);max-width:58ch;}
  .case-quote span{display:block;margin-top:8px;font-family:var(--mono);font-style:normal;font-size:11px;color:var(--paper-soft);letter-spacing:.06em;text-transform:uppercase;}

  /* ---- risk read (b, light) ---- */
  .dims{display:flex;flex-direction:column;gap:20px;margin-top:8px;}
  .dim-row{display:grid;grid-template-columns:140px 200px 1fr;gap:20px;align-items:start;}
  .dim-label{font-weight:600;font-size:15px;padding-top:4px;}
  .dim-bar{display:flex;gap:4px;}
  .dim-cell{flex:1;height:26px;border:1px solid var(--gray-line);background:transparent;}
  .dim-cell.on1{background:var(--tier1);border-color:var(--tier1);}
  .dim-cell.on2{background:var(--tier2);border-color:var(--tier2);}
  .dim-cell.on3{background:var(--tier3);border-color:var(--tier3);}
  .dim-cell.on4{background:var(--tier4);border-color:var(--tier4);}
  .dim-desc{font-size:15px;color:var(--ink-soft);line-height:1.5;}
  .dim-row.dominant .dim-label{color:var(--red-accent);}
  .dim-row.dominant .dim-label::after{content:" ←";}
  .riskread-result{margin-top:22px;display:flex;align-items:baseline;gap:16px;border-top:1px solid var(--gray-line);padding-top:18px;}
  .riskread-tier{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(28px,2.9vw,40px);color:var(--red-bright);}
  .riskread-note{font-size:15px;color:var(--ink-soft);max-width:44ch;}

  /* ---- options / cards3 (c, light) ---- */
  .cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px;}
  .card{background:var(--card-bg);padding:20px 18px;display:flex;flex-direction:column;gap:10px;min-height:270px;}
  .card-letter{font-family:var(--mono);font-size:11px;color:var(--red-accent);letter-spacing:.08em;}
  .card-title{font-weight:700;font-size:16px;line-height:1.25;}
  .card-desc{font-size:14.5px;color:var(--ink-soft);line-height:1.5;flex:1;}
  .card-meta{font-size:12px;line-height:1.4;border-top:1px solid var(--gray-line);padding-top:8px;}
  .card-meta b{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--gray-mid);display:block;margin-bottom:2px;}
  .vote-strip{margin-top:18px;background:var(--red-dark);color:var(--paper);padding:14px 20px;font-size:14px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;}
  .vote-strip b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-soft);}

  /* ---- recommendation (d, dark) ---- */
  .rr{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .rr-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-soft);}
  .rr-tier{font-family:var(--serif);font-style:italic;font-size:clamp(22px,2.2vw,30px);color:var(--paper);}
  .rr-why{font-size:14.5px;color:var(--paper-soft);max-width:56ch;margin-top:2px;}
  .rr-arrow{margin:14px 0;color:var(--paper-soft);font-size:20px;}
  .rr-call{font-family:var(--sans);font-weight:800;font-size:clamp(26px,3vw,40px);letter-spacing:-.01em;line-height:1.15;}
  .rr-support{font-size:21px;color:var(--paper-soft);max-width:64ch;margin-top:10px;line-height:1.5;}
  .rr-cost{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-dark);font-size:16.5px;color:var(--paper-soft);}
  .rr-cost b{color:var(--paper);font-weight:600;}

  /* ---- close ---- */
  .close-draft{display:inline-block;margin-top:22px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-soft);border:1px solid var(--line-dark);padding:6px 12px;}

  /* ---- index overlay ---- */
  #indexOverlay{
    position:fixed;inset:0;background:rgba(12,10,9,.96);z-index:50;display:none;
    padding:60px clamp(32px,6vw,90px);overflow-y:auto;
  }
  #indexOverlay.show{display:block;}
  #indexOverlay h2{color:var(--paper);font-weight:300;font-size:28px;margin-bottom:26px;}
  .idx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
  .idx-item{
    border:1px solid var(--line-dark);padding:14px 16px;cursor:pointer;color:var(--paper-soft);
    font-size:13px;line-height:1.4;transition:.15s;
  }
  .idx-item:hover{background:rgba(255,255,255,.06);color:var(--paper);}
  .idx-item .idx-num{font-family:var(--mono);color:var(--red-bright);margin-right:8px;}

  @media(max-width:820px){
    .role-row{grid-template-columns:1fr;gap:4px;}
    .cards3{grid-template-columns:1fr;}
    .stakes-cols{grid-template-columns:1fr;}
    .flow{flex-direction:column;}
    .flow-arrow{transform:rotate(90deg);}
    .gridtable{grid-template-columns:100px repeat(4,1fr);font-size:11px;}
    .dim-row{grid-template-columns:1fr;gap:6px;}
    .dim-row .dim-desc{order:3;}
  }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="dots" id="dots"></div>
<div class="footer" id="footerBar">
  <span id="footerLeft"></span>
  <span id="footerRight"></span>
</div>
<div id="indexOverlay">
  <h2>Shadow AI — Index <span style="font-family:var(--mono);font-size:13px;color:var(--paper-soft);">(esc to close)</span></h2>
  <div class="idx-grid" id="idxGrid"></div>
</div>

<script>
/* ============ CONTENT ============ */
const S = [];
const TIER_NAME = {1:'Limited',2:'Controlled',3:'High',4:'Critical'};
function rtier(n){return 'Risk Tier '+n+' — '+TIER_NAME[n];}

/* 0 — Cover */
S.push({type:'cover',
  eyebrow:'Shadow AI Role Play · Enterprise AI in Practice',
  headline:'*Shadow AI*: The Role Play',
  sub:'A company just found out how much unapproved artificial intelligence use is already happening inside it. Tonight, we work through what to do about it — live.',
  people:[['Ray Han','IT Director'],['Lewis Ho','Counsel'],['Arman Tan','Chief Executive']],
  date:'30.07.2026'
});

/* 0.1 — Scenario + roles */
S.push({type:'scenario', eyebrow:'The Scenario',
  head:'An internal review found wide, unregulated AI use across the company.',
  sub:'The chief executive has to decide what to do about it — in real time, with counsel in the room.',
  roles:[
    ['Ray Han','IT Director','Presents each case — what people are doing, and why.'],
    ['Lewis Ho','Counsel','Owns the framework, lays out the options and their trade-offs.'],
    ['Arman Tan','Chief Executive','Drives the risk read, and makes the call.']
  ]
});

/* 0.2 — What Ray found */
S.push({type:'list4', eyebrow:'What Ray Found', ray:true,
  head:'Four Case Studies',
  items:[
    ['01','Regulated professional work','Contract review, customer identity checks, clinical documentation, financial advice — on consumer tools.'],
    ['02','Engineering pipelines','Outside AI tools wired into build pipelines, on unmanaged keys.'],
    ['03','Marketing & communications','Outside frontier tools used instead of the approved one.'],
    ['04','Agentic workflows','Autonomous software on company devices, acting with device credentials.']
  ],
  close:'What we know: *Shadow AI is already happening* — across all four, at very different levels of risk. Tonight is about what to do next.'
});

/* 0.3 -- What's at stake (NEW, intro placement) */
S.push({type:'stakes', eyebrow:"What's at Stake",
  head:'This Is Not Only a Technology Question',
  cols:[
    ['Financial penalty','Up to the higher of S$1 million or 10% of annual Singapore turnover -- and every enforcement decision is published by name.'],
    ['Breach notification','Incidents causing significant harm, or affecting 500 or more people, must be notified within three days of assessment.'],
    ['Personal officer liability','Directors and officers face personal liability -- including criminal penalties under Section 157(1) of the Companies Act -- where a breach is attributable to their neglect, consent, or connivance.'],
    ['Disqualification','A court may disqualify a director from office for up to five years, or longer, following conviction of certain offences.']
  ],
  callout:'The single most useful fact in the board briefing: penalties attach to *intentional or negligent contravention* -- not to an accidental breach where reasonable care was exercised. A documented, dated decision is the strongest available defence. That is what tonight\'s method produces.',
  source:'Source: Board Briefing -- Shadow Artificial Intelligence -- Singapore Personal Data Protection Act; Companies Act s.157(1)'
});

/* 1 -- I-4a tiers */
S.push({type:'tiers', eyebrow:'The Method · I-4a', head:'The Four Risk Tiers',
  tiers:[
    ['t1','Risk Tier 1 · Limited','Approved tools, acceptable-use rules, basic training'],
    ['t2','Risk Tier 2 · Controlled','Named owner, documented review, vendor checks, monitoring'],
    ['t3','Risk Tier 3 · High','Formal review, human oversight, approval records, monitoring'],
    ['t4','Risk Tier 4 · Critical','Stop -- or senior approval with a documented justification']
  ],
  note:'The risk tier decides how hard we govern. Our job on each case is to place it.'
});

/* 2 -- I-4b grid */
S.push({type:'grid', eyebrow:'The Method · I-4b', head:'How We Place It',
  tierHeaders:['Risk Tier 1<i>Limited</i>','Risk Tier 2<i>Controlled</i>','Risk Tier 3<i>High</i>','Risk Tier 4<i>Critical</i>'],
  rows:[
    ['Data','what goes in',['non-sensitive','internal / confidential','personal / customer','regulated / patient / special']],
    ['Consequence','if it\'s wrong',['trivial','affects a process, correctable','materially affects a person or a regulated decision','determines someone\'s outcome, or at scale']],
    ['Autonomy','what it does alone',['drafts only','suggests, a human approves each','acts within limits, a human can step in','acts on its own, hard to undo']]
  ],
  notes:['*You don\'t average -- one high box is enough.*','Where the lines sit between boxes is risk appetite, not a fixed answer.','Shadow overlay, every risk tier: contract or replace the tool, and open a fast intake queue -- or the shadow use comes back.']
});

/* 3 -- How tonight runs */
S.push({type:'flow', eyebrow:'How Tonight Runs', head:'Every Case, the Same Shape',
  steps:[['The Case',false],['Risk Read',false],['Options + Vote',true],['Recommendation',false]],
  note:'After Lewis lays out the options, the room votes on what to do -- then Lewis and Arman say which one actually holds up, and why.'
});

/* ---- Case builder ---- */
function addCase(n,name,tierLabel,c){
  S.push({type:'case', tag:`Case ${n} · ${name} · Ray`,
    headline:c.a.headline, why:c.a.why, scale:c.a.scale, quote:c.a.quote});
  S.push({type:'riskread', tag:`Case ${n} · Risk Read`,
    dims:c.b.dims, tierResult:c.b.tierResult, tierNote:c.b.tierNote});
  S.push({type:'options', tag:`Case ${n} · Options`, options:c.c.options, vote:c.c.vote});
  S.push({type:'call', tag:`Case ${n} · Recommendation`, tierLabel:tierLabel,
    call:c.d.call, why:c.d.why, cost:c.d.cost});
}

addCase(1,'Regulated Professional Work','Risk Tier 3 -- High (Risk Tier 4 -- Critical for clinical & financial-advice work)',{
  a:{headline:'Contract review, customer identity checks, clinical documentation, and financial advice -- all drafted using consumer AI tools.',
     why:'<b>No approved tool existed</b> for this work.', scale:'Scale: [N people / teams]',
     quote:'This is the work we\'re most answerable for.'},
  b:{dims:[
      {label:'Data',tier:3,desc:'This work handles personal and customer information, and in some cases patient or financial records -- the kind of data regulators scrutinize most closely.'},
      {label:'Consequence',tier:4,desc:'An error here can directly determine an outcome for a real person -- a wrong clinical note or financial recommendation, not just an inconvenience.'},
      {label:'Autonomy',tier:2,desc:'Low. The AI produces a draft only, and a person is expected to review it before use -- though in practice, that review isn\'t yet enforced.'}
     ], tierResult:rtier(3), tierNote:'Overall risk sits at Tier 3, driven by Consequence -- the dimension where a mistake has the most direct impact on a real person. For the clinical and financial-advice work specifically, Consequence alone pushes the case to Tier 4, Critical, regardless of how the other two dimensions read.'},
  c:{options:[
      {letter:'A',title:'Block All Use',desc:'Prohibit AI tools for this work entirely until an approved option exists.',closes:'The risk completely.',leaves:'Kills productivity; use tends to move to personal, invisible devices.'},
      {letter:'B',title:'Named Reviewer Sign-Off',desc:'Every AI-assisted output must carry the sign-off of the responsible, named professional before it is used or sent.',closes:'The actual gap.',leaves:'The whole review burden sits on the most senior, most expensive person.'},
      {letter:'C',title:'Two-Stage Review and Sign-Off',desc:'A trained reviewer checks the AI-assisted draft first. The responsible professional then signs the corrected version.',closes:'The same gap as B, faster.',leaves:'A new role, and a new point of failure.'}
     ], vote:'Staff are drafting client and patient work with consumer tools. Which would you choose?'},
  d:{call:'Adopt Two-Stage Review and Sign-Off.',

/* ============ RENDER ============ */
function em(t){return (t||'').replace(/\*(.+?)\*/g,'<span class="em">$1</span>');}

function tierClass(n){return 'on'+n;}

function render(s,i){
  const el = document.createElement('section');
  el.className = 'slide ' + (['cover','tiers','flow','case','call','close'].includes(s.type) ? 'dark':'light');
  el.dataset.index = i;
  let title = '';
  let html = '';

  if(s.type==='cover'){
    title = 'Cover';
    html = `<div class="cover-top">${s.eyebrow}</div>
    <div class="cover-headline">${em(s.headline)}</div>
    <div class="cover-sub">${s.sub}</div>
    <div class="cover-people">
      ${s.people.map(p=>`<div class="cover-person"><b>${p[0]}</b><span>${p[1]}</span></div>`).join('')}
    </div>`;
    el.innerHTML = html;
    el.dataset.footLeft = s.date;
    el.dataset.footRight = '→ Arrow keys · Esc for index';
  }

  if(s.type==='scenario'){
    title = 'The Scenario & Roles';
    html = `<div class="eyebrow">${s.eyebrow}</div>
    <div class="content">
      <div class="statement-head">${em(s.head)}</div>
      <div class="body-copy">${s.sub}</div>
      <div class="roles-table">
        ${s.roles.map(r=>`<div class="role-row"><div class="role-name">${r[0]}</div><div class="role-title">${r[1]}</div><div class="role-desc">${r[2]}</div></div>`).join('')}
      </div>
    </div>`;
    el.innerHTML = html;
    el.dataset.footLeft = 'Enterprise AI in Practice · 30 July 2026';
  }

  if(s.type==='list4'){
    title = s.head;
    html = `<div class="eyebrow">${s.eyebrow}</div>
    <div class="content">
      <div class="statement-head" style="max-width:26ch">${em(s.head)}</div>
      <div class="list4">
        ${s.items.map(it=>`<div class="list4-row"><div class="list4-num">${it[0]}</div><div><div class="list4-title">${it[1]}</div><div class="list4-sub">${it[2]}</div></div></div>`).join('')}
      </div>
      <div class="list4-close">${em(s.close)}</div>
    </div>`;
    el.innerHTML = html;
    el.dataset.footLeft = 'Ray Han · IT Director';
  }

  if(s.type==='stakes'){
    title = s.head;
    html = `<div class="eyebrow">${s.eyebrow}</div>
    <div class="content">
      <div class="statement-head" style="max-width:24ch">${s.head}</div>
      <div class="stakes-cols">
        ${s.cols.map(c=>`<div class="stakes-item"><div class="stakes-kicker">${c[0]}</div><div class="stakes-detail">${c[1]}</div></div>`).join('')}
      </div>
      <div class="stakes-callout">${em(s.callout)}</div>
    </div>`;
    el.innerHTML = html;
    el.dataset.footLeft = s.source;
  }

  if(s.type==='tiers'){
    title = s.head;
    html = `<div class="eyebrow">${s.eyebrow}</div>
    <div class="content">
      <div class="statement-head">${s.head}</div>
      <div class="ladder">
        ${s.tiers.map(t=>`<div class="tier-row ${t[0]}"><div class="tier-tag">${t[1]}</div><div class="tier-ctrl">${t[2]}</div></div>`).join('')}
      </div>
      <div class="ladder-note">${s.note}</div>
    </div>`;
    el.innerHTML = html;
    el.dataset.footLeft = 'Lewis Ho · Counsel · LexGuard four-tier framework';
  }

  if(s.type==='grid'){
    title = s.head;
    let gt = `<div class="gcell head"></div>` + s.tierHeaders.map(t=>`<div class="gcell head">${t}</div>`).join('');
    s.rows.forEach(r=>{
      gt += `<div class="gcell dim">${r[0]}<br><span style="font-weight:400;color:var(--gray-mid);font-size:11px">${r[1]}</span></div>`;
      r[2].forEach((c,ci)=>{ gt += `<div class="gcell t${ci+1}">${c}</div>`; });
    });
    html = `<div class="eyebrow">${s.eyebrow}</div>
    <div class="content">
      <div class="statement-head">${s.head}</div>
      <div class="gridtable">${gt}</div>
      <div class="grid-notes">
        <div class="rule">${em(s.notes[0])}</div>
        <p>${s.notes[1]}</p>
        <p>${s.notes[2]}</p>
      </div>
    </div>`;
    el.innerHTML = html;
    el.dataset.footLeft = 'Checked against Lewis\'s published framework, lexguard-ai.com';
  }

  if(s.type==='flow'){
    title = s.head;
    html = `<div class="eyebrow">${s.eyebrow}</div>
    <div class="content">
      <div class="statement-head">${s.head}</div>
      <div class="flow">
        ${s.steps.map((st,idx)=>(idx>0?`<div class="flow-arrow">→</div>`:'')+`<div class="flow-step ${st[1]?'hi':''}">${st[0]}</div>`).join('')}
      </div>
      <div class="flow-note">${s.note}</div>
    </div>`;
    el.innerHTML = html;
    el.dataset.footLeft = 'Every case follows this same shape';
  }

  if(s.type==='case'){
    title = s.tag;
    html = `<div class="case-tag">${s.tag}</div>
    <div class="content">
      <div class="case-headline">${s.headline}</div>
      <div class="case-why">${s.why}</div>
      <div class="case-scale">${s.scale}</div>
      <div class="case-quote">"${s.quote}"<span>Ray Han</span></div>
    </div>`;
    el.innerHTML = html;
    el.dataset.footLeft = 'The Case';
  }

  if(s.type==='riskread'){
    title = s.tag;
    const maxTier = Math.max(...s.dims.map(x=>x.tier));
    const dimsHtml = s.dims.map(d=>{
      let cells='';
      for(let t=1;t<=4;t++){ cells += `<div class="dim-cell ${t===d.tier?tierClass(t):''}"></div>`; }
      return `<div class="dim-row ${d.tier===maxTier?'dominant':''}">
        <div class="dim-label">${d.label}</div>
        <div class="dim-bar">${cells}</div>
        <div class="dim-desc">${d.desc}</div>
      </div>`;
    }).join('');
    html = `<div class="case-tag" style="color:var(--gray-mid)">${s.tag}</div>
    <div class="content">
      <div class="statement-head" style="color:var(--ink)">Risk Read</div>
      <div class="dims">${dimsHtml}</div>
      <div class="riskread-result">
        <div class="riskread-tier">${s.tierResult}</div>
        <div class="riskread-note">${s.tierNote}</div>
      </div>
    </div>`;
    el.innerHTML = html;
    el.dataset.footLeft = 'Arman drives · Ray & Lewis rate';
  }

  if(s.type==='options'){
    title = s.tag;
    html = `<div class="case-tag" style="color:var(--gray-mid)">${s.tag}</div>
    <div class="content">
      <div class="statement-head" style="color:var(--ink)">How to Address This Risk Tier</div>
      <div class="cards3">
        ${s.options.map(o=>`<div class="card">
          <div class="card-letter">Option ${o.letter}</div>
          <div class="card-title">${o.title}</div>
          <div class="card-desc">${o.desc}</div>
          <div class="card-meta"><b>Closes</b>${o.closes}</div>
          <div class="card-meta"><b>Leaves open</b>${o.leaves}</div>
        </div>`).join('')}
      </div>
      <div class="vote-strip"><b>Vote</b>${s.vote}</div>
    </div>`;
    el.innerHTML = html;
    el.dataset.footLeft = 'Lewis lays out the options · room votes';
  }

  if(s.type==='call'){
    title = s.tag;
    html = `<div class="rr-label">${s.tag}</div>
    <div class="content">
      <div class="rr-tier">${s.tierLabel}</div>
      <div class="rr-arrow">↓</div>
      <div class="rr-label">Recommendation</div>
      <div class="rr-call">${em(s.call)}</div>
      <div class="rr-support">${s.why}</div>
      <div class="rr-cost"><b>Cost.</b> ${s.cost}</div>
    </div>`;
    el.innerHTML = html;
    el.dataset.footLeft = 'Lewis & Arman';
  }

  if(s.type==='close'){
    title = s.head;
    html = `<div class="eyebrow">${s.eyebrow}</div>
    <div class="content">
      <div class="case-headline" style="max-width:24ch">${s.head}</div>
      <div class="body-copy" style="color:var(--paper-soft);max-width:62ch">${em(s.body)}</div>
      <div class="body-copy" style="color:var(--paper-soft);max-width:62ch;margin-top:2px">${em(s.body2)}</div>
      <div class="close-draft">${s.draft}</div>
    </div>`;
    el.innerHTML = html;
    el.dataset.footLeft = s.source;
  }

  el.dataset.title = title;
  return el;
}

/* ============ MOUNT ============ */
const stage = document.getElementById('stage');
const dotsWrap = document.getElementById('dots');
const idxGrid = document.getElementById('idxGrid');
let current = 0;

S.forEach((s,i)=>{
  const el = render(s,i);
  stage.appendChild(el);
  const dot = document.createElement('div');
  dot.className='dot';
  dot.addEventListener('click',()=>go(i));
  dotsWrap.appendChild(dot);
  const idxItem = document.createElement('div');
  idxItem.className='idx-item';
  idxItem.innerHTML = `<span class="idx-num">${String(i+1).padStart(2,'0')}</span>${el.dataset.title}`;
  idxItem.addEventListener('click',()=>{go(i);toggleIndex(false);});
  idxGrid.appendChild(idxItem);
});

function go(i){
  if(i<0||i>=S.length) return;
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));
  const el = stage.children[i];
  el.classList.add('active');
  dotsWrap.children[i].classList.add('active');
  document.getElementById('footerLeft').textContent = el.dataset.footLeft || '';
  document.getElementById('footerRight').textContent = (el.dataset.footRight || (`${String(i+1).padStart(2,'0')} of ${S.length}`));
  current = i;
}

function toggleIndex(force){
  const ov = document.getElementById('indexOverlay');
  const show = force!==undefined ? force : !ov.classList.contains('show');
  ov.classList.toggle('show', show);
}

document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){ toggleIndex(); return; }
  if(document.getElementById('indexOverlay').classList.contains('show')) return;
  if(e.key==='ArrowRight' || e.key===' ') go(current+1);
  if(e.key==='ArrowLeft') go(current-1);
});

go(0);
</script>
