<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise AI in Practice #2 — Governance as Advantage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Surfaces */
    --paper:#fafaf8;
    --ink:#0a0a0a;
    --grey-1:#f0f0ee;
    --grey-2:#d4d4d2;
    --grey-3:#737373;

    /* Accent — Stanford Cardinal */
    --accent:#8C1515;
    --accent-on:#ffffff;
    --accent-bright:#C4322D;   /* accent on dark backgrounds only */

    /* Text roles — use these instead of opacity */
    --text-primary:#0a0a0a;
    --text-secondary:#525252;
    --text-helper:#737373;
    --text-on-color:#ffffff;
    --border-subtle:#e0e0e0;

    /* Type */
    --sans:"Inter","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    --mono:"JetBrains Mono","IBM Plex Mono","SF Mono",Consolas,ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--ink);}
  body{font-family:var(--sans);overflow:hidden;}
  .stage{position:fixed;inset:0;}
  .slide{
    position:absolute;inset:0;display:none;flex-direction:column;
    padding:clamp(28px,4.5vw,64px) clamp(32px,5.5vw,80px);
    transition:opacity .35s ease;
  }
  .slide.active{display:flex;}
  /* Three-tone system, matching June's index.html: light (paper), accent
     (cardinal red — the deck's one dramatic tone), dark (true near-black,
     reserved for photo slides like the ported iceberg slide). */
  .slide.light{background:var(--paper);color:var(--ink);}
  .slide.accent{background:var(--accent);color:var(--accent-on);}
  .slide.dark{background:var(--ink);color:var(--paper);}

  /* Emphasis — no italic serif anywhere in this deck. Accent color +
     weight instead of italics, matching the June reference system. */
  .em{color:var(--accent);font-weight:600;}
  .slide.accent .em, .slide.dark .em{color:var(--accent-on);}

  .eyebrow{
    font-family:var(--mono);font-size:14px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--text-helper);
  }
  .slide.accent .eyebrow, .slide.dark .eyebrow{color:rgba(255,255,255,.7);}
  .footer{
    position:absolute;left:0;right:0;bottom:22px;padding:0 clamp(32px,5.5vw,80px);
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-size:14px;letter-spacing:.06em;color:var(--text-helper);
  }
  .slide.accent .footer, .slide.dark .footer{color:rgba(255,255,255,.7);}
  /* Ported slides: footerLeft would only duplicate their own .t-meta
     source-attribution line, so it's hidden here -- visibility:hidden,
     not display:none, so #footerBar keeps two flex children and
     justify-content:space-between still pins footerRight (the page
     number, which stays visible everywhere) to the right edge instead of
     collapsing back to flex-start. The ported slide's own footer row
     sits right at its canvas-card's bottom padding (4.4vh of the fixed
     720px frame = ~32px) with ~20px of 14px/1.45-line-height text above
     that, so its text center lands ~42px from the bottom -- noticeably
     higher than this shared footer's default bottom:22px (~30px center).
     Nudging bottom to 34px brings the two into closer visual alignment. */
  body.index-port-active #footerLeft{visibility:hidden;}
  body.index-port-active #footerBar{bottom:34px;}
  .dots{
    position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:center;
    gap:5px;pointer-events:none;
  }
  .dot{width:5px;height:5px;border-radius:1px;background:var(--border-subtle);}
  .slide.accent .dot, .slide.dark .dot{background:rgba(255,255,255,.3);}
  .dot.active{background:var(--accent);}
  .slide.accent .dot.active, .slide.dark .dot.active{background:var(--accent-on);}
  .body-copy{font-size:max(18px,1.08vw);line-height:1.55;color:var(--text-secondary);max-width:none;}
  .slide.accent .body-copy, .slide.dark .body-copy{color:rgba(255,255,255,.85);}
  .content{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-bottom:60px;}

  /* Slide title — the workhorse heading, used by toc/scenario/stakes/grid/flow.
     No width cap: content fills the full slide width (design-system rule). */
  .statement-head{font-weight:200;font-size:min(5vw,8.4vh);line-height:1.1;}
  /* Secondary-scale heading: options-slide title, risk-read title. */
  .head-secondary{font-weight:200;font-size:min(4.6vw,7.6vh);line-height:1.15;}
  /* Large item label — role names, list/flow item titles. */
  .label-large{font-weight:300;font-size:min(3vw,5vh);line-height:1.1;}

  /* ---- Cover (intro) ---- */
  .cover-top{font-family:var(--mono);font-size:14px;letter-spacing:.16em;color:rgba(255,255,255,.7);text-transform:uppercase;}
  .cover-intro-headline{font-family:var(--sans);font-weight:200;font-size:min(11vw,15vh);line-height:1.02;margin-top:15vh;letter-spacing:-.01em;}
  .cover-sub{font-size:min(2.2vw,3.6vh);font-weight:300;color:rgba(255,255,255,.85);margin-top:22px;max-width:46ch;line-height:1.35;}
  .cover-meta{position:absolute;left:clamp(32px,5.5vw,80px);bottom:80px;display:flex;flex-direction:column;gap:5px;}
  .cover-meta .cm-when{font-size:16px;font-weight:600;}
  .cover-meta .cm-where{font-family:var(--mono);font-size:14px;letter-spacing:.05em;color:rgba(255,255,255,.7);}

  /* ---- Scenario ---- */
  .roles-table{margin-top:10px;border-top:1px solid var(--border-subtle);}
  .role-row{display:grid;grid-template-columns:1.1fr 1.2fr 2fr;gap:24px;padding:18px 0;border-bottom:1px solid var(--border-subtle);align-items:baseline;}
  .role-name{font-family:var(--sans);font-weight:300;font-size:min(3vw,5vh);}
  .role-title{font-family:var(--mono);font-size:14px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase;}
  .role-desc{font-size:max(18px,1.08vw);color:var(--text-secondary);}

  /* ---- list4 (TOC + Four Case Studies) ---- */
  .list4{margin-top:6px;border-top:1px solid var(--border-subtle);}
  .list4-row{display:grid;grid-template-columns:70px 1fr;gap:22px;padding:18px 0;border-bottom:1px solid var(--border-subtle);align-items:baseline;}
  .list4-num{font-family:var(--sans);font-weight:200;font-size:min(3vw,5vh);color:var(--text-helper);}
  .list4-title{font-family:var(--sans);font-weight:300;font-size:min(3vw,5vh);color:var(--text-helper);}
  .list4-sub{font-size:max(18px,1.08vw);color:var(--text-helper);margin-top:4px;}
  /* current-section highlight, same treatment as risk-read's dominant-dimension marker:
     accent color + trailing arrow, nothing else invented. */
  .list4-row.active .list4-num,
  .list4-row.active .list4-title{color:var(--accent);}
  .list4-row.active .list4-title::after{content:" ←";}
  .slide.accent .list4,
  .slide.dark .list4{border-top-color:rgba(255,255,255,.18);}
  .slide.accent .list4-row,
  .slide.dark .list4-row{border-bottom-color:rgba(255,255,255,.18);}
  .slide.accent .list4-num, .slide.accent .list4-title,
  .slide.dark .list4-num, .slide.dark .list4-title{color:rgba(255,255,255,.7);}
  .slide.accent .list4-row.active .list4-num, .slide.accent .list4-row.active .list4-title,
  .slide.dark .list4-row.active .list4-num, .slide.dark .list4-row.active .list4-title{color:var(--accent-on);}
  .slide.accent .list4-sub, .slide.dark .list4-sub{color:rgba(255,255,255,.7);}

  /* ---- stakes ---- */
  .stakes-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px 36px;margin-top:8px;}
  .stakes-item{border-top:1px solid var(--border-subtle);padding-top:10px;}
  .stakes-kicker{font-family:var(--mono);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:5px;}
  .stakes-detail{font-size:max(22px,2vw);color:var(--text-secondary);line-height:1.4;}
  .stakes-callout{margin-top:16px;border-top:2px solid var(--accent);padding-top:14px;font-family:var(--sans);font-weight:200;font-size:min(3vw,5vh);color:var(--accent);line-height:1.3;}

  /* ---- risk framework image (replaces the built tier ladder) ---- */
  .risk-image-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin-top:8px;}
  .risk-image{max-width:100%;max-height:100%;object-fit:contain;}

  /* ---- placement matrix (grid) ---- */
  .gridtable{display:grid;grid-template-columns:150px repeat(4,1fr);border-top:1px solid var(--border-subtle);margin-top:6px;}
  .gcell{padding:14px 14px;font-size:max(18px,1.08vw);line-height:1.4;border-bottom:1px solid var(--border-subtle);}
  .gcell.head{font-family:var(--mono);font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-helper);}
  .gcell.dim{font-weight:600;font-size:15px;}
  .gcell.t1{background:var(--grey-1);}
  .gcell.t2{background:#d9e4e0;}
  .gcell.t3{background:#f0d4c8;}
  .gcell.t4{background:#e7b3aa;}
  .grid-notes{margin-top:16px;display:flex;flex-direction:column;gap:6px;}
  .grid-notes .rule{font-family:var(--sans);font-weight:600;font-size:max(18px,1.08vw);color:var(--accent);}

  /* ---- flow ---- */
  .flow{display:flex;align-items:stretch;gap:0;margin-top:10px;}
  .flow-step{flex:1;background:rgba(255,255,255,.08);padding:26px 20px;text-align:center;font-family:var(--sans);font-weight:300;font-size:min(3vw,5vh);display:flex;align-items:center;justify-content:center;min-height:110px;}
  .flow-step.hi{background:var(--paper);color:var(--accent);font-weight:700;}
  .flow-arrow{width:34px;display:flex;align-items:center;justify-content:center;font-size:18px;color:rgba(255,255,255,.7);}

  /* ---- case opener ---- */
  .case-tag{font-family:var(--mono);font-size:14px;letter-spacing:.1em;color:rgba(255,255,255,.7);text-transform:uppercase;}
  .case-title{font-family:var(--sans);font-weight:200;font-size:min(4.6vw,7.6vh);line-height:1.15;max-width:32ch;margin-top:10px;}
  .case-desc{margin-top:14px;font-size:max(22px,2vw);font-weight:400;color:rgba(255,255,255,.9);max-width:44ch;}
  .case-why{margin-top:18px;font-size:max(22px,2vw);color:rgba(255,255,255,.85);}
  .case-why b{color:var(--accent-on);font-weight:600;}
  .case-scale{margin-top:6px;font-family:var(--mono);font-size:14px;color:rgba(255,255,255,.7);}
  .case-risk{margin-top:22px;padding-top:16px;border-top:1px solid var(--border-subtle);}
  .case-risk-label{font-family:var(--mono);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:6px;}
  /* Spec calls for "var(--accent)" here, matching the light-toned risk-read
     assessment line -- but this slide's own background IS var(--accent), so
     that would render invisible. Using --accent-on (white) for the same
     "distinct, colored result line" effect against this slide's actual
     background. Flagged in the Phase 3 report. */
  .case-risk-text{font-size:max(20px,1.5vw);font-weight:400;color:var(--accent-on);}
  .case-risk-text b{font-weight:700;}
  .case-quote{margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,.18);font-family:var(--sans);font-weight:300;font-size:max(22px,2vw);color:var(--accent-on);max-width:58ch;}
  .case-quote span{display:block;margin-top:8px;font-family:var(--mono);font-size:14px;color:rgba(255,255,255,.7);letter-spacing:.06em;text-transform:uppercase;}

  /* ---- risk read ---- */
  .dims{display:flex;flex-direction:column;gap:20px;margin-top:8px;}
  .dim-row{display:grid;grid-template-columns:minmax(220px,320px) 200px 1fr;gap:20px;align-items:start;}
  .dim-label{font-family:var(--sans);font-weight:300;font-size:min(2.2vw,3.6vh);line-height:1.1;}
  .dim-bar{display:flex;gap:4px;margin-top:8px;}
  .dim-cell{flex:1;height:26px;border:1px solid var(--border-subtle);background:transparent;}
  .dim-cell.on1{background:var(--grey-1);border-color:var(--grey-1);}
  .dim-cell.on2{background:var(--grey-3);border-color:var(--grey-3);}
  .dim-cell.on3{background:var(--accent-bright);border-color:var(--accent-bright);}
  .dim-cell.on4{background:var(--accent);border-color:var(--accent);}
  .dim-desc{font-size:max(18px,1.08vw);font-weight:400;color:var(--text-secondary);line-height:1.5;padding-top:2px;}
  .dim-row.dominant .dim-label{color:var(--accent);}
  .dim-row.dominant .dim-label::after{content:" ←";}
  .riskread-assessment{margin-top:22px;border-top:1px solid var(--border-subtle);padding-top:18px;font-family:var(--sans);font-weight:400;font-size:max(20px,1.5vw);line-height:1.4;color:var(--accent);}

  /* ---- options ---- */
  .options-head{font-family:var(--sans);font-weight:200;font-size:min(4.6vw,7.6vh);line-height:1.15;max-width:32ch;}
  .cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px;}
  .card{background:var(--grey-1);padding:20px 18px;display:flex;flex-direction:column;gap:10px;min-height:300px;transition:background .3s ease,color .3s ease;}
  .card-letter{font-family:var(--mono);font-size:14px;color:var(--accent);letter-spacing:.08em;}
  .card-title{font-family:var(--sans);font-weight:600;font-size:max(22px,2vw);line-height:1.25;}
  .card-desc{font-size:max(18px,1.08vw);color:var(--text-secondary);line-height:1.5;flex:1;}
  /* Click 2 of the options reveal: the recommended card turns accent, white text. */
  .card.recommended{background:var(--accent);}
  .card.recommended .card-letter{color:var(--accent-on);}
  .card.recommended .card-title{color:var(--accent-on);}
  .card.recommended .card-desc{color:rgba(255,255,255,.85);}
  .options-reasoning{
    margin-top:18px;font-family:var(--sans);font-weight:400;font-size:max(22px,2vw);color:var(--accent);
    opacity:0;transition:opacity .4s ease;
  }
  .options-reasoning.show{opacity:1;}

  /* ---- close ---- */
  /* (case-headline-style class reused for the close slide's head — see .case-title) */

  /* ---- index overlay ---- */
  #indexOverlay{
    position:fixed;inset:0;background:rgba(10,10,10,.96);z-index:50;display:none;
    padding:60px clamp(32px,6vw,90px);overflow-y:auto;
  }
  #indexOverlay.show{display:block;}
  #indexOverlay h2{color:var(--paper);font-weight:200;font-size:28px;margin-bottom:26px;}
  .idx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
  .idx-item{
    border:1px solid rgba(255,255,255,.18);padding:14px 16px;cursor:pointer;color:rgba(255,255,255,.7);
    font-size:14px;line-height:1.4;transition:.15s;
  }
  .idx-item:hover{background:rgba(255,255,255,.06);color:var(--paper);}
  .idx-item .idx-num{font-family:var(--mono);color:var(--accent-bright);margin-right:8px;}

  @media(max-width:820px){
    .role-row{grid-template-columns:1fr;gap:4px;}
    .cards3{grid-template-columns:1fr;}
    .stakes-cols{grid-template-columns:1fr;}
    .flow{flex-direction:column;}
    .flow-arrow{transform:rotate(90deg);}
    .gridtable{grid-template-columns:100px repeat(4,1fr);font-size:14px;}
    .dim-row{grid-template-columns:1fr;gap:6px;}
    .dim-row .dim-desc{order:3;}
  }

  /* ============================================================
     INDEX.HTML PORT DEPENDENCIES — unchanged since Phase 1.
     Scoped to .slide.index-port only. These seven slides are restored
     verbatim from index.html and are NOT restyled by this design pass —
     they are the reference the rest of the deck now matches.
     ============================================================ */
  .slide.index-port{
    padding:0;overflow:hidden;
    --paper:#fafaf8;--ink:#0a0a0a;
    --grey-1:#f0f0ee;--grey-2:#d4d4d2;--grey-3:#737373;
    --accent:#8C1515;--accent-on:#ffffff;--accent-bright:#C4322D;
    --text-primary:#0a0a0a;--text-secondary:#525252;--text-helper:#737373;
    --border-subtle:#e0e0e0;
    --sans:"Inter","Helvetica Neue","Helvetica","Arial","Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
    --sans-zh:"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans SC","Microsoft YaHei UI","Microsoft YaHei","微软雅黑",sans-serif;
    --mono:"JetBrains Mono","IBM Plex Mono","SF Mono","Cascadia Code","Consolas","Courier New",ui-monospace,monospace;
    --sp-9:48px;
  }
  .index-port .canvas-card{
    width:100vw;height:100vh;
    background:var(--paper);color:var(--ink);
    padding:5.6vh 5vw 4.4vh;
    display:flex;flex-direction:column;
    position:relative;overflow:hidden;
  }
  .index-port .canvas-card .chrome-min{
    display:flex;justify-content:space-between;align-items:flex-start;
    font-family:var(--mono);font-size:14px;font-weight:500;
    letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-helper);
    flex:0 0 auto;
    margin-bottom:var(--sp-9);
  }
  .index-port .canvas-card .chrome-min .l,
  .index-port .canvas-card .chrome-min .r{max-width:48vw;line-height:1.5;}
  .index-port .t-meta{
    font-family:var(--mono);
    font-size:14px;font-weight:500;
    letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-helper);line-height:1.45;
  }
  .index-port .t-body{
    font-family:var(--sans),var(--sans-zh);
    font-size:18px;font-weight:400;
    color:var(--text-primary);line-height:1.5;
    letter-spacing:-.005em;
  }

  /* ---- mobile index-toggle button ----
     Escape isn't reachable on a touch-only device, so this is the only
     way in on a phone. Small and unobtrusive; matches the footer's mono
     chrome treatment. Excluded from tap-zone navigation below. */
  #indexToggleBtn{
    position:absolute;right:clamp(20px,4vw,48px);bottom:56px;z-index:10;
    width:34px;height:34px;border-radius:2px;border:1px solid rgba(255,255,255,.22);
    background:rgba(0,0,0,.15);color:var(--text-helper);
    font-family:var(--mono);font-size:15px;line-height:1;cursor:pointer;
  }
  /* #indexToggleBtn lives outside #stage as a sibling of it, not as a
     sibling of individual .slide elements nested inside -- a plain CSS
     sibling combinator off .slide.accent/.slide.dark can never match it.
     go() mirrors the active slide's own tone onto <body> instead. */
  body.tone-accent #indexToggleBtn, body.tone-dark #indexToggleBtn{color:rgba(255,255,255,.7);}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="dots" id="dots"></div>
<div class="footer" id="footerBar">
  <span id="footerLeft"></span>
  <span id="footerRight"></span>
</div>
<button id="indexToggleBtn" aria-label="Open slide index" title="Slide index (Esc)">⊞</button>
<div id="indexOverlay">
  <h2>Enterprise AI in Practice #2 — Index <span style="font-family:var(--mono);font-size:13px;color:rgba(255,255,255,.7);">(esc to close)</span></h2>
  <div class="idx-grid" id="idxGrid"></div>
</div>

<script>
/* ============ CONTENT ============ */
const S = [];

const TOC_ITEMS = [
  ['01','Recap','Where we left off.'],
  ['02','The Shadow AI Role Play','Four cases, live.'],
  ['03','Skills Demo','Confirmed at 6:30.']
];

/* 0 — Welcome / cover (intro). Copy unchanged — restyle only (Cardinal,
   not black, matching June's own cover). */
S.push({type:'cover-intro', tone:'accent',
  eyebrow:'Enterprise AI in Practice · #2',
  headline:'Governance as *Advantage*',
  sub:'Thank you for joining us this evening. Let’s get to work.',
  when:'Thursday, July 30 · 6:30–9:30 PM',
  where:'SQ Collective × Gen-AI Labs, Singapore',
  foot:'30.07.2026'
});

/* 1 — Table of contents (first appearance — highlights Recap).
   tone:'accent', not 'light' like the other two TOC appearances: without
   this, the sequence toc -> SWISS-SURVEY -> SWISS-HOOK-95 is three
   consecutive light slides in a row, and the latter two are untouchable
   verbatim June ports. Recoloring this one TOC appearance is the only
   available lever; the other two TOC appearances stay 'light'. */
S.push({type:'toc', tone:'accent', eyebrow:'Tonight’s Agenda',
  head:'Three Parts to Tonight',
  items:TOC_ITEMS,
  active:0,
  foot:'Enterprise AI in Practice · Session Two'
});

/* 2–8 — Recap, restored verbatim from index.html (Session One keynote).
   Untouched by the design pass — these seven are the reference the rest

function em(t){return (t||'').replace(/\*(.+?)\*/g,'<span class="em">$1</span>');}

function tierClass(n){return 'on'+n;}

     className/innerHTML path the native slide types use below. Untouched
     by the design pass. */

    const tmp = document.createElement('div');
    tmp.innerHTML = s.raw.trim();
    const el = tmp.firstElementChild;
    el.classList.add('index-port');
    el.dataset.index = i;
    el.dataset.title = s.title;
    return el;
  }

  const el = document.createElement('section');
  el.className = 'slide ' + (s.tone === 'accent' ? 'accent' : s.tone === 'dark' ? 'dark' : 'light');
  el.dataset.index = i;
  let title = '';
  let html = '';

  if(s.type==='cover-intro'){
    title = 'Welcome';
    html = `<div class="cover-top">${s.eyebrow}</div>

  }

  el.innerHTML = html;
  el.dataset.title = title;

}

/* Native options-slide two-click reveal: click 1 shows three neutral
   cards (already rendered); click 2 highlights the recommended card and
   fades in the reasoning line. Uses the same window.__pipeAdvance
   mechanism the ported layers-stack slide (Enterprise AI Success) uses —
   not a new staging system. */
function optionsReveal(slide){
  const letter = slide.dataset.recLetter;
  const card = slide.querySelector('.card[data-letter="'+letter+'"]');
  const reasoning = slide.querySelector('.options-reasoning');
  if(card) card.classList.remove('recommended');
  if(reasoning) reasoning.classList.remove('show');
  let stage = 0;

  window.__pipeAdvance = function(){
    if(stage === 0){
      if(card) card.classList.add('recommended');
      if(reasoning) reasoning.classList.add('show');
      stage++;
      return true;
    }
    window.__pipeAdvance = null;
    return false;
  };
}

   recipes closed over in index.html. Dispatched from go() below, the

const IP_EASE_ENTRY_EXP = [0, 0, .3, 1];

function ipMotionAnimate(el, keyframes, opts){
  if(window.__ipMotionFn){ window.__ipMotionFn(el, keyframes, opts); return; }
  if(keyframes.opacity) el.style.opacity = keyframes.opacity[keyframes.opacity.length-1];
  if(keyframes.transform) el.style.transform = keyframes.transform[keyframes.transform.length-1];
}

function ipHook95(slide){
  const num = slide.querySelector('[data-anim="hook-num"]');
  if(num){num.style.opacity='0';num.style.transform='translateY(20px)';}
  if(num){
    ipMotionAnimate(num, {opacity:[0,1], transform:['translateY(20px)','translateY(0)']},
      {duration:.85, delay:.25, easing:IP_EASE_ENTRY_EXP});
  }
}

function ipJCurveFresh(slide){
  const headline = slide.querySelector('[data-anim="jcurve-headline"]');
  const path = slide.querySelector('.jcurve-fresh-path');
  if(headline){headline.style.opacity='0';headline.style.transform='translateY(14px)';}
  if(path){path.style.strokeDashoffset='1700';}
  if(headline){
    ipMotionAnimate(headline, {opacity:[0,1], transform:['translateY(14px)','translateY(0)']},
      {duration:.7, delay:.15, easing:IP_EASE_ENTRY_EXP});
  }
  requestAnimationFrame(()=>{ if(path) path.style.strokeDashoffset = '0'; });
}

function ipIcebergImg(slide){
  const headline = slide.querySelector('[data-anim="iceberg-headline"]');
  const label23 = slide.querySelector('[data-anim="iceberg-23"]');
  const label77 = slide.querySelector('[data-anim="iceberg-77"]');
  if(headline){headline.style.opacity='0';headline.style.transform='translateY(14px)';}
  if(label23){label23.style.opacity='0';label23.style.transform='translateX(-14px)';}
  if(label77){label77.style.opacity='0';label77.style.transform='translateY(20px)';}
  if(headline){
    ipMotionAnimate(headline, {opacity:[0,1], transform:['translateY(14px)','translateY(0)']},
      {duration:.7, delay:.15, easing:IP_EASE_ENTRY_EXP});
  }
  if(label23){
    ipMotionAnimate(label23, {opacity:[0,1], transform:['translateX(-14px)','translateX(0)']},
      {duration:.6, delay:.85, easing:IP_EASE_ENTRY_EXP});
  }
  if(label77){
    ipMotionAnimate(label77, {opacity:[0,1], transform:['translateY(20px)','translateY(0)']},
      {duration:.85, delay:1.30, easing:IP_EASE_ENTRY_EXP});
  }
}

function ipPillarFade(slide){
  const children = [...slide.querySelectorAll('.canvas-card > *')];
  children.forEach((el,i)=>{
    el.style.opacity = '0';
    el.style.transform = 'translateY(12px)';
    ipMotionAnimate(el, {opacity:[0,1], transform:['translateY(12px)','translateY(0)']},
      {duration:.65, delay:.15 + i*.1, easing:IP_EASE_ENTRY_EXP});
  });
}

function ipLayersStack(slide){
  const bars = [...slide.querySelectorAll('.layer-bar')];
  const pcts = [...slide.querySelectorAll('.layer-pct')];
  const govBar = slide.querySelector('#gov-bar');
  let stage = 0;

  bars.forEach(b => { b.style.opacity = '0'; b.style.transform = 'translateX(60px)'; b.style.width = '100%'; });
  pcts.forEach(p => { p.style.opacity = '0'; });
  if(govBar){ govBar.style.opacity = '0'; govBar.style.transform = 'translateX(-40px)'; }

  window.__pipeAdvance = function(){
    if(stage < 3){
      const bar = bars[stage];
      bar.style.opacity = '1';
      bar.style.transform = 'translateX(0)';
      stage++;
      return true;
    } else if(stage === 3){
      if(govBar){ govBar.style.opacity = '1'; govBar.style.transform = 'translateX(0)'; }
      stage++;
      return true;
    } else if(stage === 4){
      bars.forEach((b,i) => {
        const pct = b.dataset.pctValue || '100';
        b.style.width = pct + '%';
        if(pcts[i]) pcts[i].style.opacity = '1';
      });
      stage++;
      return true;
    }
    window.__pipeAdvance = null;
    return false;
  };
}

const IP_RECIPES = {
  'hook-95': ipHook95,
  'jcurve-fresh': ipJCurveFresh,
  'iceberg-img': ipIcebergImg,
  'pillar-fade': ipPillarFade,
  'layers-stack': ipLayersStack
};

/* ============ MOUNT ============ */
const stage = document.getElementById('stage');
const dotsWrap = document.getElementById('dots');
const idxGrid = document.getElementById('idxGrid');
let current = 0;

S.forEach((s,i)=>{
  const el = render(s,i);
  stage.appendChild(el);
  const dot = document.createElement('div');
  dot.className='dot';
  dot.addEventListener('click',()=>go(i));
  dotsWrap.appendChild(dot);
  const idxItem = document.createElement('div');
  idxItem.className='idx-item';
  idxItem.innerHTML = `<span class="idx-num">${String(i+1).padStart(2,'0')}</span>${el.dataset.title}`;
  idxItem.addEventListener('click',()=>{go(i);toggleIndex(false);});
  idxGrid.appendChild(idxItem);
});

function go(i){
  if(i<0||i>=S.length) return;
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));
  const el = stage.children[i];
  el.classList.add('active');
  dotsWrap.children[i].classList.add('active');

  /* ported slides carry their own source-attribution line inside the
     canvas-card, near the same bottom edge -- hide this deck's own dots
     (redundant chrome for a full-bleed slide) and the shared footer's
     LEFT side only (genuinely redundant with that attribution line).
     footerRight (the page number) stays visible on every slide, these
     seven included -- it's this deck's own numbering, not June's, and
     has nothing to duplicate. See body.index-port-active in the CSS for
     the matching visibility/position rules. */
  const isIndexPort = el.classList.contains('index-port');
  dotsWrap.style.display = isIndexPort ? 'none' : 'flex';
  document.body.classList.toggle('index-port-active', isIndexPort);

  /* mirror the active slide's own tone onto <body> -- #indexToggleBtn
     (and anything else outside #stage) can't reach it via a plain CSS
     sibling combinator, since it isn't a sibling of individual .slide
     elements, only of #stage itself. */
  document.body.classList.toggle('tone-accent', el.classList.contains('accent'));
  document.body.classList.toggle('tone-dark', el.classList.contains('dark'));

  document.getElementById('footerLeft').textContent = el.dataset.footLeft || '';
  document.getElementById('footerRight').textContent = (el.dataset.footRight || (`${String(i+1).padStart(2,'0')} of ${S.length}`));
  current = i;

  /* dispatch the ported animation recipe, same as index.html's playSlide() */
  window.__pipeAdvance = null;
  const fn = IP_RECIPES[el.dataset.animate];
  if(fn) fn(el);

  /* native options-slide two-click reveal -- same window.__pipeAdvance
     mechanism as the ported layers-stack recipe above, not a new one. */
  if(el.dataset.recLetter) optionsReveal(el);
}

function toggleIndex(force){
  const ov = document.getElementById('indexOverlay');
  const show = force!==undefined ? force : !ov.classList.contains('show');
  ov.classList.toggle('show', show);
}

document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){ toggleIndex(); return; }
  if(document.getElementById('indexOverlay').classList.contains('show')) return;
  if(e.key==='ArrowRight' || e.key===' '){
    if(window.__pipeAdvance && window.__pipeAdvance()) return;
    go(current+1);
    return;
  }
  if(e.key==='ArrowLeft') go(current-1);
});

document.getElementById('indexToggleBtn').addEventListener('click', ()=> toggleIndex());

/* ============ TOUCH NAVIGATION ============
   Tap right two-thirds: advance (same __pipeAdvance-gated path as
   ArrowRight). Tap left third: back. Swipe left/right: same, ~50px
   horizontal threshold, ignored when vertical movement dominates.
   Taps on the dots row, index overlay, and index toggle are excluded
   so their own click handlers (already wired above) run instead.

   Single-finger touches only. The moment a second finger is detected
   (a pinch-zoom gesture), this backs off completely -- no preventDefault,
   no swipe/tap handling -- so native pinch-zoom and the pan that follows
   it work unhindered. Single-finger touchmove still calls preventDefault
   (outside the excluded zones) so the browser's own drag/bounce doesn't
   fight with swipe detection; that's a runtime veto and needs the
   listener registered non-passive to take effect. */
const EXCLUDED_TOUCH_TARGETS = '.dots, #indexOverlay, #indexToggleBtn';
let touchStartX = 0, touchStartY = 0, touchExcluded = false, touchIsMulti = false;

document.addEventListener('touchstart', (e)=>{
  touchIsMulti = e.touches.length > 1;
  const t = e.changedTouches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchExcluded = !!(e.target.closest && e.target.closest(EXCLUDED_TOUCH_TARGETS));
}, {passive:true});

document.addEventListener('touchmove', (e)=>{
  if(e.touches.length > 1){ touchIsMulti = true; return; }
  if(touchExcluded) return;
  e.preventDefault();
}, {passive:false});

document.addEventListener('touchend', (e)=>{
  if(touchExcluded || touchIsMulti) return;
  if(document.getElementById('indexOverlay').classList.contains('show')) return;

  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);

  const advance = () => { if(window.__pipeAdvance && window.__pipeAdvance()) return; go(current+1); };

  if(absDx > 50 && absDx > absDy){
    if(dx < 0) advance(); else go(current-1);
    return;
  }
  if(absDx < 10 && absDy < 10){
    const leftThird = window.innerWidth / 3;
    if(t.clientX < leftThird) go(current-1); else advance();
  }
});

go(0);
</script>
<!-- Motion One 动效引擎 — same local asset index.html uses, same CDN fallback.
     Ported recipes (ipHook95 etc.) degrade to an instant final-state snap
     via ipMotionAnimate() if this hasn't resolved yet or fails to load. -->
<script type="module">
  import('./assets/motion.min.js')
    .then(m => { window.__ipMotionFn = m.animate; })
    .catch(() => {
      import('https://cdn.jsdelivr.net/npm/motion@11.11.17/+esm')
        .then(m => { window.__ipMotionFn = m.animate; })
        .catch(() => {});
    });
</script>
</body>
